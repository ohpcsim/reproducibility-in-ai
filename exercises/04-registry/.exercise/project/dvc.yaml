stages:
  clean:
    cmd: python clean.py
    deps:
      - data/penguins.csv
      - clean.py
    params:
      - clean
    outs:
      - results/clean.csv
  validate:
    cmd: python validate.py
    deps:
      - results/clean.csv
      - validate.py
    outs:
      - results/validated.csv
  report:
    cmd: python report.py
    deps:
      - results/validated.csv
      - report.py
    params:
      - report
    metrics:
      - metrics.json:
          cache: false
  split:
    cmd: python split.py
    deps:
      - results/validated.csv
      - split.py
    outs:
      - splits.json:
          cache: false
  train:
    cmd: python train.py
    deps:
      - results/validated.csv
      - splits.json
      - train.py
    params:
      - train
    outs:
      - model.pkl
    metrics:
      - model_metrics.json:
          cache: false
